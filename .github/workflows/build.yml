name: macOS CI Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build App
        run: |
          xcodebuild build \
            -project MyAppName.xcodeproj \
            -scheme MyAppName \
            -sdk macosx \
            -configuration Debug \
            -derivedDataPath ./build \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM=""

      - name: Verify Signature
        run: codesign --verify --verbose=2 ./build/Build/Products/Debug/MyAppName.app

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MyAppName-MacNative
          path: ./build/Build/Products/Debug/MyAppName.app