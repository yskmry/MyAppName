name: iOS CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    build:
        runs-on: macos-15

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Install XcodeGen
              run: brew install xcodegen

            - name: Generate Xcode Project
              run: xcodegen generate

            - name: Test Build
              run: |
                  xcodebuild build \
                    -project MyAppName.xcodeproj \
                    -scheme MyAppName \
                    -sdk macosx \
                    -configuration Debug \
                    CODE_SIGNING_ALLOWED=NO \
                    CODE_SIGNING_REQUIRED=NO

            - name: Upload Build Artifact
              uses: actions/upload-artifact@v4
              with:
                  name: MyAppName-MacNative
                  # 👇 保存パスを macosx 用に変更
                  path: /Users/runner/Library/Developer/Xcode/DerivedData/MyAppName-*/Build/Products/Debug/MyAppName.app
