name: macOS CI Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: macos-15 # Uses macOS 15 runner

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      # ✅ STEP 1: Create Self-Signed Certificate & Keychain
      - name: Setup Code Signing
        run: |
          # 1. Create a temporary keychain
          security create-keychain -p "" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          
          # 2. Generate a self-signed cert
          openssl req -x509 -newkey rsa:2048 -keyout /tmp/key.pem -out /tmp/cert.pem -days 365 -nodes -subj "/CN=MyLocalDevCert"
          
          # 3. Import cert and key
          security import /tmp/cert.pem -k build.keychain -T /usr/bin/codesign
          security import /tmp/key.pem -k build.keychain -T /usr/bin/codesign
          
          # 4. Trust the cert
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" build.keychain
          security add-trusted-cert -d -r trustRoot -k build.keychain /tmp/cert.pem

      # ✅ STEP 2: Build with Signing Enabled
      - name: Build App
        run: |
          xcodebuild build \
            -project MyAppName.xcodeproj \
            -scheme MyAppName \
            -sdk macosx \
            -configuration Debug \
            -derivedDataPath ./build \
            CODE_SIGN_IDENTITY="MyLocalDevCert" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM=""

      # ✅ STEP 3: Verify Signature
      - name: Verify Signature
        run: codesign --verify --verbose=2 ./build/Build/Products/Debug/MyAppName.app

      # ✅ STEP 4: Upload Artifact (Using fixed path from -derivedDataPath)
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MyAppName-MacNative
          path: ./build/Build/Products/Debug/MyAppName.app