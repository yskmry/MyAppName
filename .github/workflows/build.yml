name: macOS CI Build

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    build:
        runs-on: macos-15

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Install XcodeGen
              run: brew install xcodegen

            - name: Generate Xcode Project
              run: xcodegen generate

            - name: Import Certificate
              env:
                  CERT_BASE64: ${{ secrets.MAC_CERT_BASE64 }}
                  KEY_BASE64: ${{ secrets.MAC_KEY_BASE64 }}
              run: |
                  # Decode
                  echo "$CERT_BASE64" | base64 --decode > /tmp/cert.pem
                  echo "$KEY_BASE64" | base64 --decode > /tmp/key.pem

                  # Verify files are valid
                  echo "=== Cert file ==="
                  head -1 /tmp/cert.pem
                  echo "=== Key file ==="
                  head -1 /tmp/key.pem

                  # Create keychain
                  KEYCHAIN_PASSWORD="build123"
                  security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
                  security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
                  security set-keychain-settings -t 3600 build.keychain

                  # ✅ CRITICAL: Add to keychain search list
                  security list-keychains -d user -s build.keychain $(security list-keychains -d user | tr -d '"')

                  # Import
                  security import /tmp/cert.pem -k build.keychain -T /usr/bin/codesign
                  security import /tmp/key.pem -k build.keychain -T /usr/bin/codesign

                  # Allow codesign access
                  security set-key-partition-list \
                    -S apple-tool:,apple:,codesign: \
                    -s -k "$KEYCHAIN_PASSWORD" build.keychain

                  # Trust system-wide
                  sudo security add-trusted-cert -d -r trustRoot \
                    -k /Library/Keychains/System.keychain /tmp/cert.pem

                  # ✅ VERIFY: Print the identity name
                  echo "=== Available identities ==="
                  security find-identity -p codesigning
                  security find-identity -p codesigning build.keychain

            - name: Build App
              run: |
                  # Verify keychain is still accessible
                  security list-keychains -d user
                  security find-identity -p codesigning

                  xcodebuild build \
                    -project MyAppName.xcodeproj \
                    -scheme MyAppName \
                    -sdk macosx \
                    -configuration Debug \
                    -derivedDataPath ./build \
                    CODE_SIGN_IDENTITY="MyLocalSign" \
                    CODE_SIGN_STYLE=Manual \
                    DEVELOPMENT_TEAM="" \
                    OTHER_CODE_SIGN_FLAGS="--keychain build.keychain"

            - name: Verify Signature
              run: |
                  codesign -dvvv ./build/Build/Products/Debug/MyAppName.app 2>&1 | grep -E "Authority|Signature|flags"
                  codesign -dvvv ./build/Build/Products/Debug/MyAppName.app/Contents/PlugIns/MyAppNameWidget.appex 2>&1 | grep -E "Authority|Signature|flags"

            - name: Upload Build Artifact
              uses: actions/upload-artifact@v4
              with:
                  name: MyAppName-MacNative
                  path: ./build/Build/Products/Debug/MyAppName.app
