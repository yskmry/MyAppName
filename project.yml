name: MyAppName
options:
    bundleIdPrefix: com.example # 👈 Keep prefix generic. Final ID will be com.example.MyAppName
    deploymentTarget:
        macOS: "15.0"

targets:
    MyAppName:
        type: application
        platform: macOS
        sources:
            - MyApp
        info:
            path: MyApp/Info.plist
        dependencies:
            - target: MyAppNameWidget

        settings:
            base:
                # ✅ ENABLE SIGNING
                CODE_SIGNING_ALLOWED: "YES"
                CODE_SIGNING_REQUIRED: "YES"

                # ✅ USE YOUR LOCAL CERTIFICATE
                CODE_SIGN_IDENTITY: "MyLocalDevCert"

                # ✅ NO TEAM NEEDED FOR PRIVATE USE
                DEVELOPMENT_TEAM: ""

                ARCHS: "arm64"
                ONLY_ACTIVE_ARCH: "NO"

                # Optional: Disable Sandbox for easier private testing
                OTHER_SWIFT_FLAGS: "-D DEBUG"

    MyAppNameWidget:
        type: app-extension
        platform: macOS
        sources:
            - MyWidget
        info:
            path: MyWidget/Info.plist
        settings:
            base:
                # ✅ ENABLE SIGNING FOR WIDGET TOO
                CODE_SIGNING_ALLOWED: "YES"
                CODE_SIGNING_REQUIRED: "YES"
                CODE_SIGN_IDENTITY: "MyLocalDevCert"
                DEVELOPMENT_TEAM: ""
                ARCHS: "arm64"
                ONLY_ACTIVE_ARCH: "NO"
