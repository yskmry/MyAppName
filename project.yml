name: MyAppName
options:
    bundleIdPrefix: com.example.MyAppName # 👈 プレフィックスをアプリ名まで含める
targets:
    MyAppName:
        type: application
        platform: macOS
        deploymentTarget: "15.0"
        sources:
            - MyApp
        info:
            path: MyApp/Info.plist
        dependencies:
            - target: MyAppNameWidget # 👈 ターゲット名を一工夫する
        settings:
            base:
                CODE_SIGNING_ALLOWED: "NO"
                CODE_SIGNING_REQUIRED: "NO"
                CODE_SIGNING_IDENTITY: ""
                ARCHS: "arm64"
                ONLY_ACTIVE_ARCH: "NO"

    # 👇 ターゲット名を変更（これで自動生成されるIDが com.example.MyAppName.MyAppNameWidget になります）
    MyAppNameWidget:
        type: app-extension
        platform: macOS
        deploymentTarget: "15.0"
        sources:
            - MyWidget
        info:
            path: MyWidget/Info.plist
        settings:
            base:
                CODE_SIGNING_ALLOWED: "NO"
                CODE_SIGNING_REQUIRED: "NO"
                CODE_SIGNING_IDENTITY: ""
                ARCHS: "arm64"
                ONLY_ACTIVE_ARCH: "NO"
