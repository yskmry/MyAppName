name: MyAppName
options:
    bundleIdPrefix: com.example
    deploymentTarget:
        macOS: "15.0"

targets:
    MyAppName:
        type: application
        platform: macOS
        sources:
            - MyApp
        info:
            path: MyApp/Info.plist
        dependencies:
            - target: MyAppNameWidget
        settings:
            base:
                CODE_SIGNING_ALLOWED: "YES"
                CODE_SIGNING_REQUIRED: "YES"
                CODE_SIGN_IDENTITY: "MyLocalDev"
                DEVELOPMENT_TEAM: ""
                ARCHS: "arm64"
                ONLY_ACTIVE_ARCH: "NO"

    MyAppNameWidget:
        type: app-extension
        platform: macOS
        sources:
            - MyWidget
        info:
            path: MyWidget/Info.plist
        settings:
            base:
                CODE_SIGNING_ALLOWED: "YES"
                CODE_SIGNING_REQUIRED: "YES"
                CODE_SIGN_IDENTITY: "MyLocalDev"
                DEVELOPMENT_TEAM: ""
                ARCHS: "arm64"
                ONLY_ACTIVE_ARCH: "NO"
