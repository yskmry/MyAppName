name: MyAppName
options:
    bundleIdPrefix: com.example
targets:
    MyAppName:
        type: application
        # 👇 platformを macOS に変更
        platform: macOS
        deploymentTarget: "15.0"
        sources:
            - MyApp
        info:
            path: MyApp/Info.plist
        settings:
            base:
                CODE_SIGNING_ALLOWED: "NO"
                CODE_SIGNING_REQUIRED: "NO"
                CODE_SIGNING_IDENTITY: ""
                ARCHS: "arm64"
                ONLY_ACTIVE_ARCH: "NO"
